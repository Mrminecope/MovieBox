name: Import MovieBox Source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message != 'Import MovieBox source'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import upstream MovieBox source
        run: |
          set -euo pipefail

          git clone --depth 1 https://github.com/mesamirh/MovieBox-Tui.git /tmp/moviebox-upstream

          cp .github/workflows/import-source.yml /tmp/import-source.yml

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/moviebox-upstream/. .
          mkdir -p .github/workflows
          cp /tmp/import-source.yml .github/workflows/import-source.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet && exit 0

          git commit -m "Import MovieBox source"
          git push origin main
